<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azure CLI Typing Practice</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f; --surface: #1a1a1a; --border: #2a2a2a;
    --text: #e0e0e0; --muted: #555; --correct: #4ec9a0;
    --incorrect: #f47067; --pending: #444; --cursor: #e0e0e0;
    --accent: #4a9eff; --tag-bg: #1e2a3a; --tag-text: #4a9eff;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  .container { width: 100%; max-width: 820px; }
  header { text-align: center; margin-bottom: 36px; }
  header h1 { font-size: 22px; font-weight: 500; margin-bottom: 6px; }
  header p { font-size: 14px; color: var(--muted); }
  .filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 24px; justify-content: center; }
  .filter-btn { font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; transition: all .15s; }
  .filter-btn:hover { color: var(--text); border-color: #444; }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .stats { display: flex; gap: 10px; margin-bottom: 20px; }
  .stat { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
  .stat-num { font-size: 22px; font-weight: 500; color: var(--text); }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .rank-val { font-size: 22px; font-weight: 500; color: var(--accent); }
  .progress-bar { height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .4s ease; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 32px; margin-bottom: 20px; }
  .card-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .card-tag { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px; background: var(--tag-bg); color: var(--tag-text); }
  .card-num { font-size: 12px; color: var(--muted); margin-left: auto; }
  .card-desc { font-size: 17px; line-height: 1.6; color: var(--text); margin-bottom: 28px; }
  .target { font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 16px; letter-spacing: 0.03em; margin-bottom: 20px; min-height: 32px; line-height: 1.9; display: flex; flex-wrap: wrap; }
  .target span { color: var(--pending); transition: color .06s; position: relative; white-space: pre; }
  .target span.correct { color: var(--correct); }
  .target span.incorrect { color: var(--incorrect); text-decoration: underline; text-decoration-color: var(--incorrect); }
  .target span.cursor::after { content: ''; position: absolute; bottom: 2px; left: 0; width: 100%; height: 2px; background: var(--cursor); animation: blink .9s step-end infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .typing-input { width: 100%; background: #111; border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 15px; color: var(--text); outline: none; transition: border-color .15s; caret-color: var(--accent); }
  .typing-input:focus { border-color: #444; }
  .typing-input.error { border-color: var(--incorrect); }
  .typing-input.complete { border-color: var(--correct); }
  .input-hint { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 18px; }
  .input-hint.error { color: var(--incorrect); }
  .input-hint.success { color: var(--correct); }
  .actions { display: flex; gap: 10px; margin-top: 20px; align-items: center; }
  .btn { padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; }
  .btn:hover { border-color: #555; background: #222; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: #3a8eef; border-color: #3a8eef; }
  .btn-hide { font-size: 12px; color: var(--muted); }
  .btn-skip { margin-left: auto; color: var(--muted); font-size: 12px; }
  .target.hidden span { color: transparent; background: var(--pending); border-radius: 2px; user-select: none; }
  .target.hidden span.correct { background: var(--correct); color: transparent; }
  .target.hidden span.incorrect { background: var(--incorrect); color: transparent; text-decoration: none; }
  .done { text-align: center; padding: 48px 0; }
  .done h2 { font-size: 24px; font-weight: 500; margin-bottom: 10px; }
  .done p { color: var(--muted); font-size: 15px; margin-bottom: 28px; }
  .rank-up { position: fixed; top: 32px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; font-size: 14px; font-weight: 500; padding: 10px 24px; border-radius: 24px; opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 999; }
  .rank-up.show { opacity: 1; }
  .restart-bar { text-align: center; margin-top: 12px; }
  .restart-bar .btn { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="rank-up" id="rank-up"></div>
<div class="container">
  <header>
    <h1>Azure CLI Typing Practice</h1>
    <p>Read the description — type the full command with flags</p>
  </header>
  <div class="filter-bar" id="filter-bar"></div>
  <div class="stats">
    <div class="stat"><div class="stat-num" id="s-done">0</div><div class="stat-label">Completed</div></div>
    <div class="stat"><div class="stat-num" id="s-rem">0</div><div class="stat-label">Remaining</div></div>
    <div class="stat"><div class="rank-val" id="s-rank">Intern</div></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
  <div id="quiz-area">
    <div class="card">
      <div class="card-meta">
        <span class="card-tag" id="card-tag"></span>
        <span class="card-num" id="card-num"></span>
      </div>
      <div class="card-desc" id="card-desc"></div>
      <div class="target" id="target"></div>
      <input class="typing-input" id="typing-input" type="text" placeholder="Type the full command..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <div class="input-hint" id="input-hint"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" style="display:none" onclick="nextCard()">Next →</button>
        <button class="btn btn-hide" id="hide-btn" onclick="toggleHide()">Hide answer</button>
        <button class="btn btn-skip" onclick="skipCard()">Skip →</button>
      </div>
    </div>
  </div>
  <div class="restart-bar">
    <button class="btn" onclick="restartCategory()">↺ Restart this category</button>
  </div>
  <div class="done" id="done-screen" style="display:none">
    <h2>✓ Done!</h2>
    <p id="done-msg"></p>
    <button class="btn btn-primary" onclick="resetDeck()">Restart all</button>
  </div>
</div>

const cats = ['All', ...new Set(allCards.map(c => c.cat))];
let activeFilter = 'All';
let deck = [];
let idx = 0;
let completedCmds = new Set();
let cardComplete = false;
let answerHidden = false;
let prevRank = getRank(0);

function numCompleted() { return completedCmds.size; }
function getFiltered() { return activeFilter === 'All' ? [...allCards] : allCards.filter(c => c.cat === activeFilter); }

function showRankUp(title) {
  const el = document.getElementById('rank-up');
  el.textContent = '🎖 Rank up: ' + title;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

function saveProgress() {
  try {
    localStorage.setItem('azcli_completedCmds', JSON.stringify([...completedCmds]));
    localStorage.setItem('azcli_filter', activeFilter);
  } catch(e) {}
}

function loadProgress() {
  try {
    const savedFilter = localStorage.getItem('azcli_filter');
    const savedCompleted = localStorage.getItem('azcli_completedCmds');
    if (!savedCompleted) return false;
    activeFilter = savedFilter || 'All';
    completedCmds = new Set(JSON.parse(savedCompleted));
    deck = getFiltered();
    idx = deck.findIndex(c => !completedCmds.has(c.cmd));
    if (idx === -1) idx = 0;
    prevRank = getRank(numCompleted());
    return true;
  } catch(e) { return false; }
}

function buildFilters() {
  const bar = document.getElementById('filter-bar');
  bar.innerHTML = '';
  cats.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'filter-btn' + (cat === activeFilter ? ' active' : '');
    b.textContent = cat;
    b.onclick = () => {
      activeFilter = cat;
      deck = getFiltered();
      idx = deck.findIndex(c => !completedCmds.has(c.cmd));
      if (idx === -1) idx = 0;
      buildFilters();
      renderCard();
      updateStats();
    };
    bar.appendChild(b);
  });
}

function updateStats() {
  const doneInFilter = deck.filter(c => completedCmds.has(c.cmd)).length;
  const remInFilter = deck.length - doneInFilter;
  document.getElementById('s-done').textContent = doneInFilter;
  document.getElementById('s-rem').textContent = remInFilter;
  document.getElementById('s-rank').textContent = getRank(numCompleted());
  document.getElementById('prog').style.width = (numCompleted() / allCards.length * 100) + '%';
}

function renderTarget(typed) {
  const target = deck[idx].cmd;
  const container = document.getElementById('target');
  container.innerHTML = '';
  for (let i = 0; i < target.length; i++) {
    const span = document.createElement('span');
    span.textContent = target[i];
    if (i < typed.length) {
      span.className = typed[i] === target[i] ? 'correct' : 'incorrect';
    } else if (i === typed.length) {
      span.className = 'cursor';
    }
    container.appendChild(span);
  }
  container.classList.toggle('hidden', answerHidden);
}

function renderCard() {
  while (idx < deck.length && completedCmds.has(deck[idx].cmd)) idx++;
  if (idx >= deck.length) { showDone(); return; }
  const card = deck[idx];
  cardComplete = false;
  document.getElementById('card-tag').textContent = card.cat;
  document.getElementById('card-num').textContent = (idx + 1) + ' / ' + deck.length;
  document.getElementById('card-desc').textContent = card.desc;
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('input-hint').textContent = '';
  document.getElementById('input-hint').className = 'input-hint';
  const input = document.getElementById('typing-input');
  input.value = '';
  input.className = 'typing-input';
  input.disabled = false;
  input.focus();
  renderTarget('');
  updateStats();
}

function toggleHide() {
  answerHidden = !answerHidden;
  document.getElementById('target').classList.toggle('hidden', answerHidden);
  document.getElementById('hide-btn').textContent = answerHidden ? 'Show answer' : 'Hide answer';
}

function nextCard() {
  idx++;
  while (idx < deck.length && completedCmds.has(deck[idx].cmd)) idx++;
  renderCard();
  saveProgress();
}

function skipCard() {
  const card = deck.splice(idx, 1)[0];
  deck.push(card);
  if (idx >= deck.length) idx = 0;
  renderCard();
  saveProgress();
}

function restartCategory() {
  deck = getFiltered();
  deck.forEach(c => completedCmds.delete(c.cmd));
  idx = 0;
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('done-screen').style.display = 'none';
  saveProgress();
  renderCard();
  updateStats();
}

function showDone() {
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('done-screen').style.display = 'block';
  const doneInFilter = deck.filter(c => completedCmds.has(c.cmd)).length;
  document.getElementById('done-msg').textContent = 'You completed all ' + doneInFilter + ' commands in this category. Rank: ' + getRank(numCompleted());
}

function resetDeck() {
  deck = getFiltered();
  idx = 0;
  completedCmds = new Set();
  prevRank = getRank(0);
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('done-screen').style.display = 'none';
  saveProgress();
  renderCard();
  updateStats();
}

document.getElementById('typing-input').addEventListener('input', function() {
  if (cardComplete) return;
  const target = deck[idx].cmd;
  const typed = this.value;
  renderTarget(typed);
  const hasError = [...typed].some((ch, i) => ch !== target[i]);
  if (typed === target) {
    cardComplete = true;
    completedCmds.add(target);
    this.className = 'typing-input complete';
    document.getElementById('input-hint').textContent = '✓ Correct! Press Enter or click Next.';
    document.getElementById('input-hint').className = 'input-hint success';
    document.getElementById('next-btn').style.display = 'inline-block';
    const newRank = getRank(numCompleted());
    if (newRank !== prevRank) { showRankUp(newRank); prevRank = newRank; }
    updateStats();
    saveProgress();
  } else if (hasError) {
    this.className = 'typing-input error';
    document.getElementById('input-hint').textContent = 'Fix the red characters to continue';
    document.getElementById('input-hint').className = 'input-hint error';
  } else {
    this.className = 'typing-input';
    document.getElementById('input-hint').textContent = '';
  }
});

document.getElementById('typing-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && cardComplete) nextCard();
});

buildFilters();
const restored = loadProgress();
if (restored) {
  buildFilters();
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('done-screen').style.display = 'none';
  renderCard();
  updateStats();
} else {
  resetDeck();
}
